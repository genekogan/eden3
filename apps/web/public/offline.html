<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0a0b0a" />
    <title>Offline · Eden</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        background: #0a0b0a;
        color: #f2f4f2;
      }

      * { box-sizing: border-box; }

      body {
        min-height: 100dvh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: calc(2rem + env(safe-area-inset-top))
          calc(1.25rem + env(safe-area-inset-right))
          calc(2rem + env(safe-area-inset-bottom))
          calc(1.25rem + env(safe-area-inset-left));
        background:
          radial-gradient(circle at 50% 42%, rgb(74 222 128 / 12%), transparent 16rem),
          #0a0b0a;
      }

      main { max-width: 28rem; text-align: center; }

      .mark {
        width: 3rem;
        height: 3rem;
        margin: 0 auto 1.5rem;
        border: 1px solid #232329;
        border-radius: 0.9rem;
        display: grid;
        place-items: center;
        background: #101211;
      }

      .dot {
        width: 1rem;
        height: 1rem;
        border-radius: 999px;
        background: #4ade80;
      }

      h1 { margin: 0; font-size: 1.5rem; font-weight: 600; }
      p { margin: 0.75rem 0 1.5rem; line-height: 1.6; color: #9aa39c; }

      button {
        min-height: 2.75rem;
        border: 1px solid rgb(74 222 128 / 55%);
        border-radius: 0.75rem;
        padding: 0.65rem 1.15rem;
        background: rgb(74 222 128 / 14%);
        color: #f2f4f2;
        font: inherit;
        cursor: pointer;
      }

      button:focus-visible { outline: 2px solid #86efac; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true"><span class="dot"></span></div>
      <h1>You’re offline</h1>
      <p>Eden will reconnect when your network is available. Your online data is not stored in this offline screen.</p>
      <button type="button" onclick="window.location.reload()">Try again</button>
    </main>
  </body>
</html>
